    <title>Clocktowerdle</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">

<body>   
    <h1>Clocktowerdle</h1>
    <div class="selectionContainer">
        <h2>Choose a character:</h2>
        <input list="characters"></input>
        <button class="guessSubmit">Make Guess</button>
    </div>
    <p class="guessCount">Guesses: <span>0</span></p>


    <div class="bigLabels">
        <div class="header name">Character</div>
        <div class="header">Original Script</div>
        <div class="header">Character Type</div>
        <div class="header">Wakes in the Night</div>
        <div class="header">Selects Player</div>
        <div class="header">Learns Info</div>
        <div class="header">Ability Details</div>    
    </div>


    <div class="guessContainer">
    </div>
    
    <template>
    <div class="guess">
        <div class="icon name"></div>
        <div class="break"></div>
        <div data-type="Original Script" class="icon">
        </div>
        <div data-type="Character Type" class="icon"></div>
        <div data-type="Wakes in The Night" class="icon"></div>
        <div data-type="Selects Player" class="icon"></div>
        <div data-type="Learns Info" class="icon"></div>
        <div data-type="Ability Details" class="icon"></div>
    </div>
    </template>

    <script src="index.js"></script>
</body>
